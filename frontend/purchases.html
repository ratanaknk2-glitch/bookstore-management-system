<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchases - Book Store MS</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page">
  <div class="toolbar toolbar-end">
    <button class="btn" id="addBtn">+ New Purchase Order</button>
  </div>
  <div id="poTable" class="table-wrap"><div class="loading">Loading...</div></div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/common.js"></script>
<script>
  let suppliers = [], books = [], poItems = [];

  Embedded.init('purchases').then(async () => {
    [suppliers, books] = await Promise.all([
      Api.get('/suppliers/index.php'),
      Api.get('/books/index.php?per_page=100'),
    ]);
    books = books.items;
    load();
    document.getElementById('addBtn').addEventListener('click', openNewPO);
  });

  async function load() {
    const list = await Api.get('/purchases/index.php');
    const el = document.getElementById('poTable');
    if (!list.length) { el.innerHTML = '<div class="empty-state">No purchase orders yet.</div>'; return; }
el.innerHTML = `
      <table>
        <thead><tr><th>PO Number</th><th>Supplier</th><th>Order Date</th><th>Book</th><th>Qty</th><th>Unit Cost</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${list.map(po => renderPORows(po)).join('')}
        </tbody>
      </table>`;
  }

  function formatDateDMY(dateStr) {
    if (!dateStr) return '—';
    const [year, month, day] = dateStr.split('-');
    return `${day}-${month}-${year}`;
  }

  function renderPORows(po) {
    const items = po.items && po.items.length ? po.items : [{ title: '—', quantity: '—', unit_cost: null }];
    const rowCount = items.length;
    const actionsHtml = po.status === 'Pending' ? `
      <button class="btn btn-outline btn-sm" onclick="receivePO(${po.purchase_id})">Receive</button>
      <button class="btn btn-danger btn-sm" onclick="cancelPO(${po.purchase_id})">Cancel</button>` : '—';

    return items.map((item, idx) => `
      <tr>
${idx === 0 ? `
          <td rowspan="${rowCount}">${escapeHtml(po.po_number)}</td>
          <td rowspan="${rowCount}">${escapeHtml(po.supplier_name)}</td>
          <td rowspan="${rowCount}">${formatDateDMY(po.order_date)}</td>` : ''}
        <td>${escapeHtml(item.title)}</td>
        <td>${item.quantity}</td>
        <td>${item.unit_cost !== null ? '$' + Number(item.unit_cost).toFixed(2) : '—'}</td>
        ${idx === 0 ? `
          <td rowspan="${rowCount}">$${Number(po.total_amount).toFixed(2)}</td>
          <td rowspan="${rowCount}"><span class="badge ${po.status === 'Received' ? 'badge-success' : po.status === 'Cancelled' ? 'badge-danger' : 'badge-warning'}">${po.status}</span></td>
          <td rowspan="${rowCount}">${actionsHtml}</td>` : ''}
      </tr>`).join('');
  }

  function openNewPO() {
    poItems = [];
    Modal.open('New Purchase Order', `
      <div class="form-group">
        <label>Supplier *</label>
        <select id="poSupplier">${suppliers.map(s => `<option value="${s.supplier_id}">${escapeHtml(s.supplier_name)}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Expected Date</label><input type="date" id="poExpected"></div>
      <hr>
      <div class="form-row">
        <div class="form-group">
          <label>Book</label>
          <select id="poBook">${books.map(b => `<option value="${b.book_id}" data-cost="${b.purchase_price}">${escapeHtml(b.title)}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Quantity</label><input type="number" id="poQty" value="1" min="1"></div>
        <div class="form-group"><label>Unit Cost</label><input type="number" step="0.01" id="poCost"></div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="addPoItem()">+ Add Item</button>
      <div id="poItemsList" class="mt-3"></div>
    `, `
      <button class="btn btn-outline" onclick="Modal.close()">Cancel</button>
      <button class="btn" onclick="submitPO()">Create Order</button>
    `);
    document.getElementById('poBook').addEventListener('change', (e) => {
      document.getElementById('poCost').value = e.target.selectedOptions[0].dataset.cost;
    });
    document.getElementById('poBook').dispatchEvent(new Event('change'));
  }

  function addPoItem() {
    const bookSelect = document.getElementById('poBook');
    const bookId = parseInt(bookSelect.value, 10);
    const title = bookSelect.selectedOptions[0].textContent;
    const qty = parseInt(document.getElementById('poQty').value, 10);
    const cost = parseFloat(document.getElementById('poCost').value);
    if (!qty || !cost) { Toast.error('Enter valid quantity and cost.'); return; }
    poItems.push({ book_id: bookId, title, quantity: qty, unit_cost: cost });
    renderPoItems();
  }

  function renderPoItems() {
    document.getElementById('poItemsList').innerHTML = poItems.length ? `
      <table><thead><tr><th>Book</th><th>Qty</th><th>Cost</th><th>Subtotal</th></tr></thead>
      <tbody>${poItems.map(i => `<tr><td>${escapeHtml(i.title)}</td><td>${i.quantity}</td><td>$${i.unit_cost.toFixed(2)}</td><td>$${(i.quantity*i.unit_cost).toFixed(2)}</td></tr>`).join('')}</tbody></table>
    ` : '<div class="empty-state">No items added yet.</div>';
  }

  async function submitPO() {
    if (!poItems.length) { Toast.error('Add at least one item.'); return; }
    try {
      await Api.post('/purchases/index.php', {
        supplier_id: document.getElementById('poSupplier').value,
        expected_date: document.getElementById('poExpected').value || null,
        items: poItems,
      });
      Toast.success('Purchase order created.');
      Modal.close();
      load();
    } catch (e) {}
  }

async function receivePO(id) {
    if (!confirmAction('Mark this order as received? Stock will be added automatically.')) return;
    try {
      await Api.put('/purchases/index.php', { purchase_id: id, action: 'receive' });
      Toast.success('Order received. Stock updated.');
      load();
      if (window.top && window.top !== window && window.top.Layout) {
        window.top.Layout.loadNotificationBadge();
      }
    }
    catch (e) {}
  }
  async function cancelPO(id) {
    if (!confirmAction('Cancel this purchase order?')) return;
    try { await Api.put('/purchases/index.php', { purchase_id: id, action: 'cancel' }); Toast.success('Order cancelled.'); load(); }
    catch (e) {}
  }
</script>
</body>
</html>
