<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management - Book Store MS</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page">
  <div class="toolbar">
    <div class="filters"><input type="text" id="searchInput" placeholder="Search..."></div>
    <button class="btn" id="addBtn">+ Add</button>
  </div>
  <div id="crudTable" class="table-wrap"><div class="loading">Loading...</div></div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/simple_crud.js"></script>
<script>
  Embedded.init('employees').then(() => {
    
    initSimpleCrud({
      endpoint: "/employees/index.php",
      idField: "employee_id",
      title: "Employee",
      canWrite: true,
      columns: [
        { key: "full_name", label: "Name" },
        { key: "position", label: "Position" },
        { key: "phone", label: "Phone" },
        { key: "salary", label: "Salary", format: v => "$" + Number(v).toFixed(2) },
        { key: "status", label: "Status" },
      ],
      formFields: [
        { name: "full_name", label: "Full Name", required: true },
        { name: "position", label: "Position" },
        { name: "phone", label: "Phone" },
        { name: "email", label: "Email", type: "email" },
        { name: "hire_date", label: "Hire Date", type: "date" },
        { name: "salary", label: "Salary", type: "number" },
        { name: "status", label: "Status", type: "select", options: [{value:"active",label:"Active"},{value:"inactive",label:"Inactive"}] },
      ],
    });

  });
</script>
</body>
</html>
