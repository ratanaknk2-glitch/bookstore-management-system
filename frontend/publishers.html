<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publishers - Book Store MS</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page">
  <div class="toolbar">
    <div class="filters"><input type="text" id="searchInput" placeholder="Search Publishers..."></div>
    <button class="btn" id="addBtn" style="display:none;">+ Add Publisher</button>
  </div>
  <div id="crudTable" class="table-wrap"><div class="loading">Loading...</div></div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/simple_crud.js"></script>
<script>
  Embedded.init('publishers').then(() => {
    const canWrite = Embedded.hasRole('Admin', 'Manager');
    if (canWrite) document.getElementById('addBtn').style.display = 'inline-block';
    
    initSimpleCrud({
      endpoint: "/publishers/index.php",
      idField: "publisher_id",
      title: "Publisher",
      canWrite,
      columns: [
        { key: "publisher_name", label: "Name" },
        { key: "phone", label: "Phone" },
        { key: "email", label: "Email" },
        { key: "address", label: "Address" },
      ],
      formFields: [
        { name: "publisher_name", label: "Publisher Name", required: true },
        { name: "phone", label: "Phone" },
        { name: "email", label: "Email", type: "email" },
        { name: "address", label: "Address", type: "textarea" },
      ],
    });

  });
</script>
</body>
</html>
