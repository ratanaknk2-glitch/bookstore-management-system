<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers - Book Store MS</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-shell">
  <div class="toolbar">
    <h1>Customer Management</h1>
    <button class="btn" id="addBtn">+ Register Customer</button>
  </div>
  <div class="toolbar">
    <div class="filters"><input type="text" id="searchInput" placeholder="Search by name, phone, or email..."></div>
  </div>
  <div id="crudTable" class="table-wrap"><div class="loading">Loading...</div></div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/simple_crud.js"></script>
<script>
  Layout.init('customers').then(() => {
    initSimpleCrud({
      endpoint: '/customers/index.php',
      idField: 'customer_id',
      title: 'Customer',
      canWrite: true,
      columns: [
        { key: 'full_name', label: 'Name' },
        { key: 'phone', label: 'Phone' },
        { key: 'email', label: 'Email' },
        { key: 'level_name', label: 'Membership' },
      ],
      extraColumn: {
        label: 'History',
        render: (item) => `<button class="btn btn-outline btn-sm" onclick="viewHistory(${item.customer_id})">Purchases</button>`,
      },
      formFields: [
        { name: 'full_name', label: 'Full Name', required: true },
        { name: 'phone', label: 'Phone' },
        { name: 'email', label: 'Email', type: 'email' },
        { name: 'address', label: 'Address', type: 'textarea' },
        { name: 'membership_id', label: 'Membership Level', type: 'select', options: [
          { value: 1, label: 'Bronze' }, { value: 2, label: 'Silver' }, { value: 3, label: 'Gold' },
        ] },
      ],
    });
  });

  async function viewHistory(customerId) {
    const history = await Api.get('/customers/index.php?history_for=' + customerId);
    Modal.open('Purchase History', history.length ? `
      <table>
        <thead><tr><th>Invoice</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
        <tbody>
          ${history.map(h => `
            <tr>
              <td>${escapeHtml(h.invoice_number)}</td>
              <td>${new Date(h.created_at).toLocaleDateString()}</td>
              <td>$${Number(h.total_amount).toFixed(2)}</td>
              <td>${escapeHtml(h.status)}</td>
            </tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty-state">No purchases yet.</div>');
  }
</script>
</body>
</html>
