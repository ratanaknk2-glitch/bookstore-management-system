<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suppliers - Book Store MS</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page">
  <div class="toolbar">
    <div class="filters"><input type="text" id="searchInput" placeholder="Search Suppliers..."></div>
    <button class="btn" id="addBtn" style="display:none;">+ Add Supplier</button>
  </div>
  <div id="crudTable" class="table-wrap"><div class="loading">Loading...</div></div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/simple_crud.js"></script>
<script>
  Embedded.init('suppliers').then(() => {
    const canWrite = Embedded.hasRole('Admin', 'Manager');
    if (canWrite) document.getElementById('addBtn').style.display = 'inline-block';
    
    initSimpleCrud({
      endpoint: "/suppliers/index.php",
      idField: "supplier_id",
      title: "Supplier",
      canWrite,
      columns: [
        { key: "supplier_name", label: "Name" },
        { key: "contact_person", label: "Contact Person" },
        { key: "phone", label: "Phone" },
        { key: "email", label: "Email" },
        { key: "status", label: "Status" },
      ],
      formFields: [
        { name: "supplier_name", label: "Supplier Name", required: true },
        { name: "contact_person", label: "Contact Person" },
        { name: "phone", label: "Phone" },
        { name: "email", label: "Email", type: "email" },
        { name: "address", label: "Address", type: "textarea" },
        { name: "status", label: "Status", type: "select", options: [{value:"active",label:"Active"},{value:"inactive",label:"Inactive"}] },
      ],
    });

  });
</script>
</body>
</html>
