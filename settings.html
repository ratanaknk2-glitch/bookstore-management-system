<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Book Store MS</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page">
  <div class="card mb-3">
    <h2>Branding</h2>
    <p class="hint mb-3"></p>
    <div class="flex gap-2" style="align-items:flex-end;">
      <div id="logoPreviewWrap">
        <label>Current Logo</label>
        <div id="logoPreview" style="width:80px;height:80px;border:1px solid var(--color-border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;background:var(--color-primary-light);font-size:28px;">📚</div>
      </div>
      <div class="form-group" style="flex:1;">
        <label>Upload New Logo (JPG, PNG, WEBP, or SVG — max 1MB)</label>
        <input type="file" id="logoInput" accept="image/png,image/jpeg,image/webp,image/svg+xml">
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <h2>Bookstore Information</h2>
    <form id="settingsForm">
      <div class="form-row">
        <div class="form-group"><label>Store Name</label><input name="store_name"></div>
        <div class="form-group"><label>Store Phone</label><input name="store_phone"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Store Email</label><input type="email" name="store_email"></div>
        <div class="form-group"><label>Store Address</label><input name="store_address"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Tax Percent (%)</label><input type="number" step="0.01" name="tax_percent"></div>
        <div class="form-group"><label>Currency Code</label><input name="currency_code"></div>
        <div class="form-group"><label>Currency Symbol</label><input name="currency_symbol"></div>
      </div>
      <div class="form-group"><label>Low Stock Threshold</label><input type="number" name="low_stock_threshold"></div>
      <div class="form-group">
        <label>Receipt Footer Message</label>
        <input name="receipt_footer_message" placeholder="Thank you for your purchase!">
        <p class="hint"></p>
      </div>
      <button type="submit" class="btn">Save Settings</button>
    </form>
  </div>

  <div class="card">
    <h2>Backup &amp; Restore Database</h2>
    <button class="btn" id="createBackupBtn">Create Backup Now</button>
    <div id="backupList" class="mt-3"></div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/common.js"></script>
<script>
  Embedded.init('settings').then(async () => {
    const settings = await Api.get('/settings/index.php');
    const form = document.getElementById('settingsForm');
    Object.entries(settings).forEach(([key, value]) => {
      const input = form.elements[key];
      if (input) input.value = value;
    });

    if (settings.store_logo) {
      document.getElementById('logoPreview').innerHTML =
        `<img src="../backend/uploads/logo/${settings.store_logo}" style="width:100%;height:100%;object-fit:contain;">`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      try {
        await Api.put('/settings/index.php', data);
        Toast.success('Settings saved.');
      } catch (err) {}
    });

    document.getElementById('createBackupBtn').addEventListener('click', createBackup);
    document.getElementById('logoInput').addEventListener('change', uploadLogo);
    loadBackups();
  });

async function uploadLogo() {
    const input = document.getElementById('logoInput');
    if (!input.files[0]) return; // nothing selected (e.g. the file picker was cancelled)
    const fd = new FormData();
    fd.append('logo', input.files[0]);
    try {
      await Api.upload('/settings/upload_logo.php', fd);
      input.value = '';
      Toast.success('Logo updated.');
      await refreshLogoPreview();
      // Sidebar logo lives in the parent shell (app.html), not this iframe.
      if (window.top && window.top !== window && window.top.Layout) {
        window.top.Layout.refreshBranding();
      }
    } catch (e) {}
  }

  async function refreshLogoPreview() {
    const settings = await Api.get('/settings/index.php');
    document.getElementById('logoPreview').innerHTML = settings.store_logo
      ? `<img src="../backend/uploads/logo/${settings.store_logo}" style="width:100%;height:100%;object-fit:contain;">`
      : '📚';
  }

  async function createBackup() {
    try {
      await Api.post('/settings/backup.php?action=create');
      Toast.success('Backup created.');
      loadBackups();
    } catch (e) {}
  }

  async function loadBackups() {
    const files = await Api.get('/settings/backup.php?action=list');
    const el = document.getElementById('backupList');
    el.innerHTML = files.length ? `
      <table>
        <thead><tr><th>Backup File</th><th>Actions</th></tr></thead>
        <tbody>${files.map(f => `
          <tr>
            <td>${escapeHtml(f)}</td>
            <td>
              <a class="btn btn-outline btn-sm" href="../backend/api/settings/backup.php?action=download&file=${encodeURIComponent(f)}">Download</a>
              <button class="btn btn-danger btn-sm" onclick="restoreBackup('${f}')">Restore</button>
            </td>
          </tr>`).join('')}</tbody>
      </table>` : '<div class="empty-state">No backups yet.</div>';
  }

  async function restoreBackup(file) {
    if (!confirmAction(`Restore database from "${file}"? This will OVERWRITE current data.`)) return;
    try {
      await Api.post('/settings/backup.php?action=restore', { file });
      Toast.success('Database restored successfully.');
    } catch (e) {}
  }
</script>
</body>
</html>
